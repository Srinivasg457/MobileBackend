name: 🐳 Deploy with Docker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3
      
    - name: 🐳 Build Docker Image
      id: build
      run: |
        echo "Building Docker image..."
        DEPLOYMENT_TIME=$(date)
        
        # Create Dockerfile for PHP 8.2
        cat > Dockerfile << 'DOCKERFILE'
        FROM php:8.2-apache
        WORKDIR /var/www/html
        COPY . .
        
        # Install system dependencies
        RUN apt-get update && apt-get install -y \
            git \
            nodejs \
            npm \
            libpng-dev \
            libzip-dev \
            zip \
            unzip \
            && docker-php-ext-install pdo_mysql gd zip \
            && npm install \
            && curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer \
            && composer install --no-dev \
            && rm -rf /var/lib/apt/lists/*
        
        EXPOSE 80
        CMD ["apache2-foreground"]
        DOCKERFILE
        
        # Build the image
        docker build -t mobilebackend:${{ github.sha }} .
        docker tag mobilebackend:${{ github.sha }} mobilebackend:latest
        
        echo "image_size=$(docker images mobilebackend:latest --format "{{.Size}}")" >> $GITHUB_OUTPUT
        echo "deployment_time=$DEPLOYMENT_TIME" >> $GITHUB_OUTPUT
        
    - name: 🔑 Setup SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/healthykid.pem
        chmod 600 ~/.ssh/healthykid.pem
        ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
        
    - name: 🚀 Deploy Docker Container
      id: deploy
      run: |
        echo "Deploying Docker container..."
        
        # Save Docker image as tar
        docker save mobilebackend:latest | gzip > mobilebackend.tar.gz
        
        # Transfer and load on server
        scp -i ~/.ssh/healthykid.pem mobilebackend.tar.gz ubuntu@${{ secrets.SERVER_HOST }}:/tmp/
        
        ssh -i ~/.ssh/healthykid.pem ubuntu@${{ secrets.SERVER_HOST }} << 'EOF'
          echo "Loading Docker image on server..."
          docker load -i /tmp/mobilebackend.tar.gz
          
          echo "Stopping old container..."
          docker stop mobilebackend-container 2>/dev/null || true
          docker rm mobilebackend-container 2>/dev/null || true
          
          echo "Starting new container..."
          docker run -d \
            --name mobilebackend-container \
            -p 8080:80 \
            -v /var/www/html/uploads:/var/www/html/uploads \
            --restart always \
            mobilebackend:latest
          
          echo "✅ Docker container deployed on port 8080!"
          echo "Container details:"
          docker ps --filter "name=mobilebackend-container" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
        EOF
        
        echo "status=success" >> $GITHUB_OUTPUT
    
    - name: 📊 Deployment Summary
      if: always()
      run: |
        echo "=========================================="
        echo "        DOCKER DEPLOYMENT SUMMARY        "
        echo "=========================================="
        if [ "${{ job.status }}" = "success" ]; then
          echo "🐳 ✅ DOCKER DEPLOYMENT DONE SUCCESSFULLY"
          echo "📦 Image: mobilebackend:${{ github.sha }}"
          echo "🖥️ Server: ${{ secrets.SERVER_HOST }}"
          echo "🚪 Port: 8080"
          echo "🔗 Access: http://${{ secrets.SERVER_HOST }}:8080"
          echo "🐘 PHP: 8.2 (Inside Docker)"
        else
          echo "❌ DOCKER DEPLOYMENT FAILED"
        fi
        echo "=========================================="
    
    - name: 🧹 Cleanup
      if: always()
      run: |
        rm -f mobilebackend.tar.gz
        rm -f ~/.ssh/healthykid.pem
        rm -f ~/.ssh/known_hosts
EOF
