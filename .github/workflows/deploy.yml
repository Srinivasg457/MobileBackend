name: 🚀 Deploy to Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3
      
    - name: 🔑 Setup SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/healthykid.pem
        chmod 600 ~/.ssh/healthykid.pem
        ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
        
    - name: 🚀 Deploy to server
      run: |
        ssh -i ~/.ssh/healthykid.pem ubuntu@"${{ secrets.SERVER_HOST }}" << 'EOF'
          cd /var/www/html
          rm -rf MobileBackend 2>/dev/null || true
          git clone https://github.com/Srinivasg457/MobileBackend.git MobileBackend
          cd MobileBackend
          echo "✅ DEPLOYMENT DONE SUCCESSFULLY"
          echo "📊 Files deployed: $(find . -type f | wc -l)"
        EOF
    
    - name: 📊 Deployment Summary
      if: always()
      run: |
        echo "=========================================="
        echo "        DEPLOYMENT SUMMARY               "
        echo "=========================================="
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ DEPLOYMENT DONE SUCCESSFULLY"
          echo "🖥️ Server: ${{ secrets.SERVER_HOST }}"
          echo "📁 Path: /var/www/html/MobileBackend"
          echo "🔗 Access: http://${{ secrets.SERVER_HOST }}/MobileBackend"
        else
          echo "❌ DEPLOYMENT FAILED"
        fi
        echo "=========================================="
    
    - name: 🧹 Cleanup
      if: always()
      run: |
        rm -f ~/.ssh/healthykid.pem
        rm -f ~/.ssh/known_hosts
