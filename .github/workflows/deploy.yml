name: Deploy to Ubuntu Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggers

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup SSH with PEM
      run: |
        # Create SSH directory
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Write PEM private key
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/healthykid.pem
        chmod 600 ~/.ssh/healthykid.pem
        
        # Add server to known_hosts
        ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
        
    - name: Deploy to Server
      run: |
        echo "Deploying to server: ${{ secrets.SERVER_HOST }}"
        
        # Use -i flag with PEM file and disable host key checking
        ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i ~/.ssh/healthykid.pem \
            ubuntu@"${{ secrets.SERVER_HOST }}" << 'EOF'
          
          echo "Connected to server $(hostname)"
          
          cd /var/www/html/MobileBackend
          
          if [ -d .git ]; then
            echo "Pulling latest changes..."
            git pull origin main
          else
            echo "Cloning repository..."
            cd ..
            sudo rm -rf MobileBackend 2>/dev/null || true
            git clone https://github.com/${{ github.repository }}.git MobileBackend
            cd MobileBackend
          fi
          
          echo "Listing deployed files:"
          ls -la
          echo "Deployment completed successfully!"
        EOF
